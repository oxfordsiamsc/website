<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seminar Archive | Oxford SIAM Student Chapter</title>
  <meta name="description" content="Every Junior Applied Mathematics Seminar (JAMS) talk at the Oxford Mathematical Institute since 2008, searchable by title and speaker.">
  <meta name="theme-color" content="#071b49">
  <meta property="og:title" content="Seminar Archive | Oxford SIAM Student Chapter">
  <meta property="og:description" content="All Junior Applied Mathematics Seminar talks since 2008.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/logo.png" type="image/png">

  <link id="main-stylesheet" rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="page-content" aria-label="Content">
      <div class="wrapper">
        <article class="post">

  <header class="post-header">
    <h1 class="post-title">Seminar Archive</h1>
  </header>

  <div class="post-content">
    <p class="seminar-intro">Every Junior Applied Mathematics Seminar talk since the Chapter was founded in 2008. <a href="seminars.html">Back to upcoming seminars</a>.</p>

    <div class="archive-tools">
      <label class="archive-search" for="archive-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="visually-hidden">Search talks</span>
        <input id="archive-search" type="search" placeholder="Search by title, speaker or affiliation" autocomplete="off" disabled>
      </label>
      <label class="archive-filter"><input id="archive-slides" type="checkbox" disabled> Only talks with slides</label>
      <p id="archive-count" class="seminar-list-note" aria-live="polite">Loading the archive…</p>
    </div>

    <div id="archive-list">
      <noscript><p class="seminar-list-note">The archive needs JavaScript. You can also browse past talks on the <a href="https://www.maths.ox.ac.uk/events/past/650">Oxford Mathematics event page</a>.</p></noscript>
    </div>

    <p class="seminar-note">Talks are collected from the <a href="https://www.maths.ox.ac.uk/events/past/650" target="_blank" rel="noopener noreferrer">Oxford Mathematics event page</a>.</p>
  </div>

</article>

      </div>
    </main><link id="fa-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css">



<script src="assets/js/site-shell.js"></script>
<script src="assets/js/archive.js" defer></script>
</body>

</html>
